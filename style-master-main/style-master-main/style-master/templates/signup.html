<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <header>
    <h1>Silent Canvas</h1>
  </header>

  <div class="container signup">
    
    <div class="side-box">
      <div class="welcome-text">
        <h1>Welcome!</h1>
        <p>Create an Identity, Unlock the Hidden.<br>Welcome to the World of the Unseen!</p>
      </div>
    </div>

    <div class="form-box">
      <form method="POST" action="{{ url_for('signup_page') }}">
        <h2>Create Account</h2>
        <div class="inputBx">
          <input type="email" name="email" placeholder="Email" required />
        </div>
        <div class="inputBx">
          <input type="password" name="password" placeholder="Password" required />
        </div>
        <div class="inputBx">
          <input type="password" name="confirm_password" placeholder="Confirm Password" required />
        </div>
        <div class="inputBx">
          <input type="submit" value="Sign Up" />
        </div>
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        <div class="links">
          <p>Already have an account? <a href="{{ url_for('login_page') }}">Log In</a></p>
        </div>
      </form>
    </div>

    <div class="ring">
      <i style="--clr:#ff357a"></i>
      <i style="--clr:#fff172"></i>
      <i style="--clr:#00f7ff"></i>
    </div>
    
  </div>
</body>
</html>
