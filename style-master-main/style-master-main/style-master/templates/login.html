<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <header>
    <h1> Silent Canvas </h1>
  </header>
  <div class="container login">
    <!-- Side Box -->
    <div class="side-box right-skew">
      <div class="welcome-text">
        <h1>Welcome back!</h1>
        <p class="segoe-script">Behind Every Pixel, a Secret<br>Are You Ready to Find It?</p>
      </div>
    </div>

    <!-- Form Box -->
    <div class="form-box">
      <form method="POST" action="{{ url_for('login_page') }}">
        <h2>Log In</h2>

        <div class="inputBx">
          <input type="email" name="email" placeholder="Email" required />
        </div>

        <div class="inputBx">
          <input type="password" name="password" placeholder="Password" required />
        </div>

        <!-- ✅ تم نقل رسالة الخطأ إلى هنا -->
        {% if error %}
          <div class="error-message">{{ error }}</div>
        {% endif %}

        <div class="inputBx">
          <input type="submit" value="Log in" />
        </div>

        <!-- Create Account Link -->
        <div class="links">
          <p>Don't have an account? <a href="{{ url_for('signup_page') }}">Create Account</a></p>
        </div>

      </form>
    </div>

    <!-- Animation Rings -->
    <div class="ring">
      <i style="--clr:#ff357a"></i>
      <i style="--clr:#fff172"></i>
      <i style="--clr:#00f7ff"></i>
    </div>
  </div>
</body>
</html>
